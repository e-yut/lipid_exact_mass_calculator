<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lipid Exact Mass Calculator</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  body { font-family: Arial, sans-serif; background:#f0f0f0; margin:0; color:#222; }
  header { background:#2c3e50; color:#fff; text-align:center; padding:14px; font-size:1.3rem; font-weight:bold; }
  main { max-width:820px; margin:16px auto; padding:0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:220px; padding:8px; font-size:1.05rem; border:1px solid #999; border-radius:4px; }
  button { padding:8px 14px; border:0; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; }
  #calc { background:#27ae60; } #pubchem { background:#2980b9; } #clear { background:#c0392b; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:.8rem; color:#666; margin:6px 0 12px; }
  .card { background:#fff; border:1px solid #ccc; border-radius:6px; padding:10px 14px; margin-bottom:12px; }
  #mass { font-size:1.15rem; font-weight:bold; color:#1a5276; }
  #error { color:#c0392b; font-weight:bold; }
  table { width:100%; border-collapse:collapse; font-family:monospace; }
  th, td { padding:5px 8px; text-align:center; border-bottom:1px solid #ddd; }
  .pos { background:#d5f5e3; } .pos2 { background:#a9dfbf; }
  .neg { background:#d6eaf8; } .neg2 { background:#a9cce3; }
  #history li { cursor:pointer; padding:3px 0; } #history li:hover { text-decoration:underline; }
  #status { font-size:.8rem; color:#555; }
</style>
</head>
<body>
<header>Lipid Exact Mass Calculator</header>
<main>
  <div class="row">
    <input id="name" value="PE(16:0/22:6)" autocomplete="off" spellcheck="false">
    <button id="calc" disabled>Calculate</button>
    <button id="pubchem" disabled>🔍 Check PubChem</button>
  </div>
  <p class="hint">e.g. PE(16:0/22:6) &nbsp; PC(O-16:0/18:1) &nbsp; SM(d18:1/16:0) &nbsp; TG(16:0/18:1/18:1) &nbsp; LPC(16:0) &nbsp; CL(18:1/18:1/18:1/18:1) &nbsp; FA(20:4)</p>

  <div class="card">
    <div id="error"></div>
    <div>Lipid class: <span id="cls">--</span></div>
    <div>Molecular formula: <span id="formula">--</span></div>
    <div id="mass">Exact mass (M): -- Da</div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Adduct</th><th>m/z (Da)</th><th>Mode</th><th>z</th></tr></thead>
      <tbody id="adducts"></tbody>
    </table>
  </div>

  <div class="card">
    <strong>History</strong> <button id="clear" type="button">Clear</button>
    <ul id="history"></ul>
  </div>
  <div id="status">Loading Python (Pyodide)…</div>
</main>

<script>
const $ = id => document.getElementById(id);
let calculate = null, currentFormula = "", history = [];

async function init() {
  const pyodide = await loadPyodide();
  const code = await (await fetch("app.py")).text();
  pyodide.runPython(code);
  const fn = pyodide.globals.get("calculate_json");
  calculate = name => JSON.parse(fn(name));
  $("calc").disabled = false;
  $("status").textContent = "Ready — enter a lipid name and press Calculate or Enter.";
  run();
}

function show(r) {
  $("error").textContent = "";
  $("cls").textContent = r.class;
  $("formula").textContent = r.formula;
  $("mass").textContent = `Exact mass (M): ${r.mass.toFixed(6)} Da`;
  const body = $("adducts");
  body.innerHTML = "";
  for (const a of r.adducts) {
    const tr = document.createElement("tr");
    tr.className = a.tag;
    [a.adduct, a.mz.toFixed(6), a.mode, a.z + (a.mode === "Positive" ? "+" : "-")]
      .forEach(t => { const td = document.createElement("td"); td.textContent = t; tr.appendChild(td); });
    body.appendChild(tr);
  }
  currentFormula = r.formula;
  $("pubchem").disabled = false;
}

function addHistory(r) {
  if (history.length && history[0].input.toUpperCase() === r.input.toUpperCase()) return;
  history.unshift(r);
  renderHistory();
}

function renderHistory() {
  const ul = $("history");
  ul.innerHTML = "";
  history.forEach(r => {
    const li = document.createElement("li");
    li.textContent = `${r.input} — ${r.mass.toFixed(4)} Da`;
    li.onclick = () => { $("name").value = r.input; show(r); };
    ul.appendChild(li);
  });
}

function run() {
  if (!calculate) return;
  const raw = $("name").value.trim();
  if (!raw) { $("error").textContent = "Please enter a lipid name."; return; }
  const r = calculate(raw);
  if (!r.ok) { $("error").textContent = r.error; return; }
  show(r);
  addHistory(r);
  $("status").textContent = `OK | '${raw}' → M = ${r.mass.toFixed(6)} Da | ${new Date().toLocaleTimeString()}`;
}

$("calc").onclick = run;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("pubchem").onclick = () => {
  if (currentFormula) window.open(
    "https://pubchem.ncbi.nlm.nih.gov/#query=" + encodeURIComponent(currentFormula) + "&input_type=formula",
    "_blank", "noopener");
};
$("clear").onclick = () => { history = []; renderHistory(); };

init().catch(e => { $("status").textContent = "Failed to load Python: " + e; });
</script>
</body>
</html>
